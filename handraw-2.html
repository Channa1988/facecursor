<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANDRAW — Draw with your hands</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #2a2a3a;
    --accent: #ff3c6e;
    --accent2: #00e5ff;
    --text: #e8e8f0;
    --muted: #555570;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 10;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .dot.active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
  .dot.drawing { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* Drawing canvas — full workspace */
  #drawCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: none;
    background: #0e0e16;
  }

  /* Mirrored webcam preview — small PiP bottom-right */
  #videoEl {
    display: none;
  }
  #pipPreview {
    position: absolute;
    bottom: 80px;
    right: 16px;
    width: 180px;
    height: 135px;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    z-index: 20;
    opacity: 0.85;
    transform: scaleX(-1); /* mirror */
  }
  #pipCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Toolbar */
  .toolbar {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 68px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    z-index: 20;
    overflow-x: auto;
  }

  .tb-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 4px;
  }

  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.active { border-color: white; transform: scale(1.2); }

  .size-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .size-btn:hover, .size-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .sep { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

  .tool-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tool-btn:hover { background: var(--border); }
  .tool-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #000;
    font-weight: 700;
  }
  .tool-btn.danger:hover { background: var(--accent); border-color: var(--accent); color: white; }

  /* Cursor overlay */
  #cursorOverlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
  }

  /* Gesture hint */
  .gesture-toast {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,60,110,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 16px;
    border-radius: 20px;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .gesture-toast.show { opacity: 1; }

  /* Loading overlay */
  #loadingOverlay {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .load-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 8px;
  }
  .load-title span { color: var(--accent); }
  .load-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .load-bar-wrap {
    width: 240px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .load-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    animation: loadprogress 2s ease forwards;
  }
  @keyframes loadprogress { to { width: 100%; } }

  .hint-box {
    margin-top: 8px;
    display: flex;
    gap: 24px;
  }
  .hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .hint-icon {
    font-size: 28px;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <div class="logo">HAND<span>RAW</span></div>
  <div class="status-pill">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">initializing</span>
  </div>
</header>

<div class="workspace">
  <canvas id="drawCanvas"></canvas>
  <canvas id="cursorOverlay"></canvas>

  <div id="pipPreview">
    <canvas id="pipCanvas"></canvas>
  </div>

  <div class="gesture-toast" id="gestureToast"></div>

  <div id="loadingOverlay">
    <div class="load-title">HAND<span>RAW</span></div>
    <div class="load-sub">Loading hand tracker…</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="hint-box">
      <div class="hint"><div class="hint-icon">☝️</div>index finger = draw</div>
      <div class="hint"><div class="hint-icon">🤌</div>pinch = lift pen</div>
      <div class="hint"><div class="hint-icon">✌️</div>two fingers up = erase</div>
    </div>
  </div>

  <video id="videoEl" playsinline></video>
</div>

<div class="toolbar">
  <span class="tb-label">Color</span>
  <div class="color-swatch active" style="background:#ff3c6e" data-color="#ff3c6e"></div>
  <div class="color-swatch" style="background:#00e5ff" data-color="#00e5ff"></div>
  <div class="color-swatch" style="background:#b8ff57" data-color="#b8ff57"></div>
  <div class="color-swatch" style="background:#ffcc00" data-color="#ffcc00"></div>
  <div class="color-swatch" style="background:#c47aff" data-color="#c47aff"></div>
  <div class="color-swatch" style="background:#ff8c42" data-color="#ff8c42"></div>
  <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>

  <div class="sep"></div>
  <span class="tb-label">Size</span>
  <button class="size-btn" data-size="3">XS</button>
  <button class="size-btn active" data-size="6">S</button>
  <button class="size-btn" data-size="12">M</button>
  <button class="size-btn" data-size="22">L</button>
  <button class="size-btn" data-size="40">XL</button>

  <div class="sep"></div>
  <button class="tool-btn" id="eraserBtn">✦ ERASER</button>
  <button class="tool-btn danger" id="clearBtn">⊘ CLEAR</button>
</div>

<script>
const drawCanvas = document.getElementById('drawCanvas');
const cursorOverlay = document.getElementById('cursorOverlay');
const pipCanvas = document.getElementById('pipCanvas');
const videoEl = document.getElementById('videoEl');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const gestureToast = document.getElementById('gestureToast');
const loadingOverlay = document.getElementById('loadingOverlay');

const dctx = drawCanvas.getContext('2d');
const cctx = cursorOverlay.getContext('2d');
const pctx = pipCanvas.getContext('2d');

let color = '#ff3c6e';
let brushSize = 6;
let isEraser = false;
let isDrawing = false;
let lastX = null, lastY = null;
let toastTimeout = null;

function resize() {
  const ws = document.querySelector('.workspace');
  const W = ws.clientWidth, H = ws.clientHeight;
  // Preserve drawing on resize
  const imgData = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
  drawCanvas.width = W; drawCanvas.height = H;
  cursorOverlay.width = W; cursorOverlay.height = H;
  try { dctx.putImageData(imgData, 0, 0); } catch(e){}
}
resize();
window.addEventListener('resize', resize);

function showToast(msg) {
  gestureToast.textContent = msg;
  gestureToast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => gestureToast.classList.remove('show'), 1500);
}

// Color swatches
document.querySelectorAll('.color-swatch').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    color = s.dataset.color;
    isEraser = false;
    eraserBtn.classList.remove('active');
  });
});

// Size buttons
document.querySelectorAll('.size-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    brushSize = parseInt(b.dataset.size);
  });
});

const eraserBtn = document.getElementById('eraserBtn');
eraserBtn.addEventListener('click', () => {
  isEraser = !isEraser;
  eraserBtn.classList.toggle('active', isEraser);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  showToast('CANVAS CLEARED');
});

// ─── Hand Tracking ───────────────────────────────────────────

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function isPinching(landmarks) {
  // Thumb tip (4) to index tip (8)
  return distance(landmarks[4], landmarks[8]) < 0.06;
}

function isTwoFingerUp(landmarks) {
  // Index (8) and middle (12) extended, ring (16) and pinky (20) down
  const indexUp = landmarks[8].y < landmarks[6].y;
  const middleUp = landmarks[12].y < landmarks[10].y;
  const ringDown = landmarks[16].y > landmarks[14].y;
  return indexUp && middleUp && ringDown;
}

function onResults(results) {
  const W = drawCanvas.width, H = drawCanvas.height;

  // Draw PiP
  pctx.save();
  pctx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
  pctx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);

  // Draw hand skeleton on pip
  if (results.multiHandLandmarks) {
    for (const lm of results.multiHandLandmarks) {
      drawConnectors(pctx, lm, HAND_CONNECTIONS,
        { color: 'rgba(0,229,255,0.5)', lineWidth: 1.5 });
      drawLandmarks(pctx, lm, { color: '#ff3c6e', lineWidth: 1, radius: 2 });
    }
  }
  pctx.restore();

  cctx.clearRect(0, 0, W, H);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    isDrawing = false;
    lastX = null; lastY = null;
    statusDot.className = 'dot active';
    statusText.textContent = 'no hand detected';
    return;
  }

  const lm = results.multiHandLandmarks[0];
  const tip = lm[8]; // index fingertip

  // Flip X because video is mirrored
  const x = (1 - tip.x) * W;
  const y = tip.y * H;

  const pinching = isPinching(lm);
  const twoFingers = isTwoFingerUp(lm);

  if (pinching) {
    if (isDrawing) showToast('PEN LIFTED');
    isDrawing = false;
    lastX = null; lastY = null;
    statusDot.className = 'dot active';
    statusText.textContent = 'pinch — pen up';

    // Draw pinch cursor
    cctx.beginPath();
    cctx.arc(x, y, 14, 0, Math.PI * 2);
    cctx.strokeStyle = 'rgba(255,60,110,0.8)';
    cctx.lineWidth = 2;
    cctx.stroke();
    cctx.beginPath();
    cctx.arc(x, y, 4, 0, Math.PI * 2);
    cctx.fillStyle = '#ff3c6e';
    cctx.fill();
    return;
  }

  if (twoFingers) {
    // Erase mode via gesture
    statusDot.className = 'dot drawing';
    statusText.textContent = 'erasing';
    if (lastX !== null) {
      dctx.globalCompositeOperation = 'destination-out';
      dctx.lineWidth = 40;
      dctx.lineCap = 'round';
      dctx.lineJoin = 'round';
      dctx.beginPath();
      dctx.moveTo(lastX, lastY);
      dctx.lineTo(x, y);
      dctx.stroke();
      dctx.globalCompositeOperation = 'source-over';
    }
    lastX = x; lastY = y;

    // Eraser cursor
    cctx.beginPath();
    cctx.arc(x, y, 20, 0, Math.PI * 2);
    cctx.strokeStyle = 'rgba(255,255,255,0.6)';
    cctx.lineWidth = 2;
    cctx.stroke();
    return;
  }

  // Normal draw
  isDrawing = true;
  statusDot.className = 'dot drawing';
  statusText.textContent = 'drawing';

  if (lastX !== null) {
    dctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
    dctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : color;
    dctx.lineWidth = isEraser ? brushSize * 3 : brushSize;
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';

    // Smooth with quadratic curve
    const midX = (lastX + x) / 2;
    const midY = (lastY + y) / 2;
    dctx.beginPath();
    dctx.moveTo(lastX, lastY);
    dctx.quadraticCurveTo(lastX, lastY, midX, midY);
    dctx.stroke();
    dctx.globalCompositeOperation = 'source-over';
  }
  lastX = x; lastY = y;

  // Finger cursor
  const cursorColor = isEraser ? 'rgba(255,255,255,0.8)' : color;
  cctx.beginPath();
  cctx.arc(x, y, (isEraser ? brushSize * 1.5 : brushSize / 2) + 3, 0, Math.PI * 2);
  cctx.strokeStyle = cursorColor;
  cctx.lineWidth = 2;
  cctx.stroke();
  cctx.beginPath();
  cctx.arc(x, y, 3, 0, Math.PI * 2);
  cctx.fillStyle = cursorColor;
  cctx.fill();

  // Crosshair
  cctx.strokeStyle = cursorColor;
  cctx.lineWidth = 1;
  cctx.globalAlpha = 0.4;
  cctx.beginPath();
  cctx.moveTo(x - 12, y); cctx.lineTo(x + 12, y);
  cctx.moveTo(x, y - 12); cctx.lineTo(x, y + 12);
  cctx.stroke();
  cctx.globalAlpha = 1;
}

async function init() {
  const hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  hands.onResults(onResults);

  const camera = new Camera(videoEl, {
    onFrame: async () => {
      await hands.send({ image: videoEl });
    },
    width: 640,
    height: 480,
  });

  try {
    await camera.start();
    statusDot.className = 'dot active';
    statusText.textContent = 'camera ready';
    loadingOverlay.style.transition = 'opacity 0.5s';
    loadingOverlay.style.opacity = '0';
    setTimeout(() => loadingOverlay.remove(), 600);
    showToast('RAISE YOUR HAND TO BEGIN');
  } catch (e) {
    statusText.textContent = 'camera blocked';
    loadingOverlay.querySelector('.load-sub').textContent = '⚠ Camera access denied. Please allow camera permissions.';
  }
}

// Wait for MediaPipe to load
window.addEventListener('load', () => {
  setTimeout(init, 500);
});
</script>
</body>
</html>
